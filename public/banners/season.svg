<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600">
  <defs>
    <radialGradient id="bg" cx="0.75" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#262626"/>
      <stop offset="1" stop-color="#0A0A0A"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <linearGradient id="giftTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8E8E5"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="600" fill="url(#bg)"/>

  <!-- string of lights -->
  <path d="M0 70 C 250 190, 520 40, 800 120 S 1350 210, 1600 90" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2"/>
  <g>
    <circle cx="70" cy="104" r="7" fill="#FCD34D"/><circle cx="70" cy="104" r="16" fill="#FCD34D" opacity="0.35" filter="url(#blur)"/>
    <circle cx="190" cy="140" r="5" fill="#FFFFFF"/>
    <circle cx="310" cy="148" r="7" fill="#FCD34D"/><circle cx="310" cy="148" r="16" fill="#FCD34D" opacity="0.35" filter="url(#blur)"/>
    <circle cx="430" cy="124" r="5" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="560" cy="96" r="7" fill="#FFFFFF"/>
    <circle cx="690" cy="98" r="5" fill="#FCD34D"/>
    <circle cx="820" cy="124" r="7" fill="#FFFFFF"/>
    <circle cx="960" cy="150" r="5" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="1090" cy="168" r="7" fill="#FCD34D"/><circle cx="1090" cy="168" r="16" fill="#FCD34D" opacity="0.35" filter="url(#blur)"/>
    <circle cx="1220" cy="166" r="5" fill="#FFFFFF"/>
    <circle cx="1350" cy="140" r="7" fill="#FFFFFF"/>
    <circle cx="1480" cy="110" r="5" fill="#FCD34D"/>
  </g>

  <!-- gift boxes -->
  <ellipse cx="1240" cy="520" rx="260" ry="18" fill="#000" opacity="0.5"/>
  <g>
    <rect x="1060" y="330" width="260" height="190" rx="10" fill="#F2F2EF"/>
    <rect x="1046" y="300" width="288" height="56" rx="10" fill="url(#giftTop)"/>
    <rect x="1176" y="300" width="28" height="220" fill="#0A0A0A"/>
    <path d="M1190 300 C 1150 240, 1100 270, 1150 300 Z" fill="none" stroke="#0A0A0A" stroke-width="10" stroke-linejoin="round"/>
    <path d="M1190 300 C 1230 240, 1280 270, 1230 300 Z" fill="none" stroke="#0A0A0A" stroke-width="10" stroke-linejoin="round"/>
  </g>
  <g>
    <rect x="1350" y="400" width="150" height="120" rx="8" fill="#1F1F1F" stroke="#3A3A3A"/>
    <rect x="1340" y="382" width="170" height="34" rx="8" fill="#2A2A2A" stroke="#3A3A3A"/>
    <rect x="1414" y="382" width="22" height="138" fill="#FCD34D"/>
  </g>

  <!-- words -->
  <g font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#FFFFFF">
    <text x="120" y="250" font-size="20" font-weight="600" letter-spacing="6" fill="#A3A3A3">FESTIVE SEASON</text>
    <text x="118" y="336" font-size="66" font-weight="700" letter-spacing="-2">Make this season</text>
    <text x="118" y="412" font-size="66" font-weight="700" letter-spacing="-2">your best yet.</text>
    <text x="120" y="470" font-size="24" fill="#A3A3A3">Gift edits, festive coupons and order-by dates.</text>
  </g>
</svg>
